<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mowne's Terminal Blog - Writings on AI and Code" />
  <title>~/Mowne/blog - Terminal Blog</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./blog.js" defer></script>
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="scanlines"></div>
  <canvas id="matrix-canvas"></canvas>
  <main class="page-container">
    <div class="blog-wrap">
      <nav class="nav">
        <span class="nav-brand">~/Mowne/blog</span>
        <div class="nav-links">
          <a href="./index.html" class="nav-link" aria-label="Profile">~/profile</a>
          <a href="./blog.html" class="nav-link" aria-label="Blog">~/blog</a>
        </div>
      </nav>

      <div id="blog-view">
        <h2 class="section-label">recent transmissions</h2>
        <ul class="post-list" id="post-list">
          <!-- Posts will be generated by blog.js -->
        </ul>
      </div>

      <div id="post-view" style="display: none; width: 100%;">
        <button id="back-btn" class="nav-link" style="background:none;border:none;cursor:pointer;padding:0;margin-bottom:2rem;">&lt; cd ..</button>
        <div id="post-content" class="markdown-body"></div>
      </div>

      <footer class="footer">
        © 2025 Mowne · built with dedication · <a href="/admin">admin</a>
      </footer>
    </div>
  </main>
</body>
</html>
